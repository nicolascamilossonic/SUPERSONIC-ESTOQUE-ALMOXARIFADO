<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPERSONIC - Gestão de Estoque & Almoxarifado</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tech: {
                            50: '#f0f4f8',
                            100: '#d9e2ec',
                            200: '#bcccdc',
                            300: '#9fb3c8',
                            400: '#829ab1',
                            500: '#627d98',
                            600: '#486581',
                            700: '#334e68',
                            800: '#243b53',
                            900: '#102a43',
                            950: '#0b1d3a'
                        },
                        accent: {
                            blue: '#3b82f6',
                            cyan: '#06b6d4',
                            emerald: '#10b981',
                            rose: '#f43f5e',
                            amber: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col min-h-screen">

        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
            <div class="w-full max-w-md p-8 glass-panel rounded-2xl shadow-2xl relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-500 mb-3 shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-boxes-stacked text-2xl text-white"></i>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white uppercase">SUPERSONIC CAMPINAS</h1>
                    <p class="text-xs text-slate-400 mt-1 uppercase tracking-wider font-semibold">ESTOQUE ALMOXARIFADO CAMPINAS</p>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                    <!-- CAMPO USUARIO -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Usuário</label>
                        <div class="relative">
                            <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="text" id="loginUsername" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition" placeholder="Informe seu usuário">
                        </div>
                    </div>

                    <!-- CAMPO SENHA -->
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1.5">Senha</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                            <input type="password" id="loginPassword" required class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition" placeholder="••••••••">
                        </div>
                    </div>

                    <!-- MENSAGEM DE ERRO -->
                    <div id="loginError" class="hidden text-xs text-rose-400 text-center font-medium bg-rose-500/10 py-2 rounded-lg border border-rose-500/20">
                        Usuário ou senha incorretos!
                    </div>

                    <!-- BOTÃO CONTINUAR / ACESSAR SISTEMA -->
                    <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:from-indigo-500 hover:to-cyan-500 text-white font-semibold text-sm rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 active:scale-[0.99] flex items-center justify-center gap-2 cursor-pointer">
                        <span>Acessar Sistema</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- MAIN LAYOUT -->
        <div id="mainLayout" class="hidden flex-1 flex flex-col md:flex-row min-h-screen bg-slate-950">
            <aside class="no-print hidden md:flex flex-col w-64 bg-slate-900/90 border-r border-slate-800/80 justify-between shrink-0">
                <div>
                    <div class="h-16 flex items-center px-6 border-b border-slate-800/80 gap-3">
                        <div class="flex items-center justify-center w-9 h-9 rounded-lg bg-indigo-600 text-white shadow-md shadow-indigo-500/20">
                            <i class="fa-solid fa-boxes-stacked text-base"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-100 tracking-wide text-xs uppercase">SUPERSONIC</div>
                            <div class="text-[10px] text-indigo-400 font-medium tracking-widest uppercase">Campinas</div>
                        </div>
                    </div>
                </div>
                <div class="p-4 border-t border-slate-800/80 bg-slate-950/40">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <div class="w-8 h-8 rounded-full bg-indigo-600/30 border border-indigo-500/50 flex items-center justify-center text-indigo-300 font-bold text-xs shrink-0" id="userAvatar">
                                NC
                            </div>
                            <div class="truncate">
                                <div class="text-xs font-semibold text-slate-200 truncate" id="userNameDisplay">Nicolas Camilo</div>
                                <div class="text-[10px] text-indigo-400 font-medium capitalize" id="userRoleDisplay">Administrador</div>
                            </div>
                        </div>
                        <button onclick="handleLogout()" title="Sair do Sistema" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800 rounded-lg transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
                <header class="no-print h-16 bg-slate-900/60 border-b border-slate-800/80 flex items-center justify-between px-4 md:px-8 shrink-0 backdrop-blur-md sticky top-0 z-30">
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <i class="fa-solid fa-server text-emerald-400 text-xs"></i>
                        <span>Almoxarifado SUPERSONIC: <strong class="text-slate-200 font-mono">ONLINE</strong></span>
                    </div>
                    <button onclick="handleLogout()" class="md:hidden text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:text-rose-400 flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i> Sair
                    </button>
                </header>

                <main class="flex-1 p-4 md:p-8 space-y-6">
                    <section id="tab-dashboard" class="tab-content space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-bold text-white tracking-tight">Visão Geral do Almoxarifado</h2>
                                <p class="text-xs text-slate-400">Sistema ativo e operacional.</p>
                            </div>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE AUTENTICAÇÃO E LÓGICA -->
    <script>
        const usersDB = [
            { username: "nicolas camilo", name: "Nicolas Camilo", pass: "321", role: "Administrador", avatar: "NC" },
            { username: "gabriel caetano", name: "Gabriel Caetano", pass: "456", role: "Operador", avatar: "GC" }
        ];

        function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('loginUsername').value.trim().toLowerCase();
            const passInput = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            const userFound = usersDB.find(u => u.username === userInput && u.pass === passInput);

            if (userFound) {
                errorDiv.classList.add('hidden');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainLayout').classList.remove('hidden');
                
                document.getElementById('userNameDisplay').innerText = userFound.name;
                document.getElementById('userRoleDisplay').innerText = userFound.role;
                document.getElementById('userAvatar').innerText = userFound.avatar;
            } else {
                errorDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainLayout').classList.add('hidden');
            document.getElementById('loginPassword').value = '';
        }
    </script>
</body>
</html>
